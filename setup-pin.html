<head>

<style>

<body>
<div class="box">
  <h2>🔧 ตั้งค่าเริ่มต้น</h2>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, push } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
const app=initializeApp({apiKey:"AIzaSyBLWpPcpu3hgQRCsPNbQnEIqOwbtnkjUQE",authDomain:"claude-8151c.firebaseapp.com",databaseURL:"https://claude-8151c-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"claude-8151c",storageBucket:"claude-8151c.firebasestorage.app",messagingSenderId:"613224139677",appId:"1:613224139677:web:d8e4b6cd547209e0133d74"});
const db=getDatabase(app);
window.setup=async()=>{
  const msg=document.getElementById('msg');
  try{
    await set(ref(db,'promptpay/config/pin'),'137946');
    await push(ref(db,'promptpay/accounts'),{name:'กรุงไทย - สัมฤทธิ์การไฟฟ้า',type:'merchant',id:'1516599014059294150',owner:'อัญชลี ยังเจริญ'});
